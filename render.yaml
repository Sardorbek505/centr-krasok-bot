services:
  - type: web
    name: centr-krasok-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    plan: free
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: ADMIN_TELEGRAM_ID
        sync: false
      - key: WEBHOOK_URL
        sync: false
